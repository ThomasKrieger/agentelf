package: "org.agentelf.taskandaction.action"
classes:
  - name: AddExistingClassesToPrompt
    annotations:
      - '@Component'
    unitTest:
      type: "llm"
      prompt: "mock ReferenceTypeRepo"
    methods:
      - documentation: |
          Iterates over sourceModel.getAllMethods(). Calls getAllUsedTypes() to lookup a type using ReferenceTypeRepo.
          Adds each found type to the prompt and returns the prompt.
        annotations :
          - '@Action(arguments = {prompt,sourceModel,referenceTypeRepo}, returnVariable = "prompt")'
        declaration: "public String addExistingClassesToPrompt(String prompt, ToSourceModel sourceModel, ReferenceTypeRepo referenceTypeRepo)"