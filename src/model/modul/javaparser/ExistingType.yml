package: "org.agentelf.javaparser"
classes:
  - name: ExistingType
    fields:
      - declaration: "CompilationUnit compilationUnit;"
    methods:
      - documentation: | 
          Iterates over all Methods of the compilationUnit. Create a new MethodHandle for each method
          and compares it with the given methodHandle. If it is equal parses the given annotationSource. And checks
          if an annotation with the given name already exists. If yes replaces the annotation, if not adds the annotation.
          Throws an exception if no method for the given methodHandle was found
        declaration: "public void setMethodAnnotation(MethodHandle methodHandle, String annotationSource)"
      - documentation: |
          Iterates over all Methods of the compilationUnit. Create a new MethodHandle for each method
          and compares it with the given methodHandle. If it is equal sets the given documentation as documentation
          of this method
        declaration: "public void setMethodDocumentation(MethodHandle methodHandle, String documentation)"
      - documentation: "Checks if an annotation with the same name exists.  If yes replaces the annotation, if not adds the annotation."
        declaration: "public void setClassAnnotation(String annotationSource)"
      - documentation: "Sets the given documentation as class documentation"
        declaration: "public void setClassDocumentation(String documentation)"